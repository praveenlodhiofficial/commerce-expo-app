name: fashion-app

version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: fashion-app
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fashion-app
    ports:
      - "5434:5432"
    volumes:
      - fashion-app-data:/var/lib/postgresql/data
    networks:
      - app-network

networks:
  app-network:
    name: fashion-network
    driver: bridge

volumes:
  fashion-app-data:
    external: false
    name: fashion-app-data